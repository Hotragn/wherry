[package]
name = "wherry"
version = "0.1.0"
description = "Wherry: escrow-backed offline payment vouchers on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wherry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", default-features = false, features = ["token", "token_2022", "associated_token"] }
solana-instructions-sysvar = "3.0.1"
solana-sha256-hasher = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
